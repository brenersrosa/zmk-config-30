# Economia de bateria: dorme após 15 min sem uso, acorda ao apertar qualquer tecla
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Mostra o nível da bateria no computador/celular
CONFIG_ZMK_BATTERY_REPORTING=y
# P0.09/P0.10 são pinos de NFC por padrão; a coluna C4 usa P0.10 (&pro_micro 16)
CONFIG_NFCT_PINS_AS_GPIOS=y
